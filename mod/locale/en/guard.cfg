[mod-name]
factory-night-watch=Factory Night Watch
[mod-description]
factory-night-watch=Offline production with safety pauses, circuit conditions and an in-game control panel.
[mod-setting-name]
fnw-enabled=Keep running with protection when empty
fnw-max-offline-hours=Maximum offline duration (simulation hours)
fnw-research-pause=Pause when research queue is empty
fnw-research-idle-minutes=Research idle delay (simulation minutes)
fnw-destruction-pause=Pause when structures are destroyed
fnw-ignore-walls=Ignore walls and gates
fnw-ignore-robots=Ignore robots
fnw-emergency-save=Request emergency save on safety pause
fnw-forces=Monitored forces
fnw-excluded-surfaces=Excluded surface names
[mod-setting-description]
fnw-enabled=Unchecked: an empty server pauses immediately. Existing safety pauses remain latched.
fnw-max-offline-hours=168 hours = 7 days. 0 = unlimited. Elapsed time persists across restarts.
fnw-research-pause=Only when no monitored force has active or queued research.
fnw-research-idle-minutes=Delay without selected or queued research.
fnw-destruction-pause=On planets by enemies, on platforms also by asteroids. Mining does not trigger a pause.
fnw-ignore-walls=Walls and gates do not trigger destruction alarms.
fnw-ignore-robots=Construction, logistic and combat robots do not trigger destruction alarms.
fnw-emergency-save=Three rotating saves. Daily backups continue separately.
fnw-forces=Comma-separated internal force names. Normally player.
fnw-excluded-surfaces=Comma-separated name fragments. Synthetic sandbox surfaces are always ignored.
