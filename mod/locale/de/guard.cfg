[mod-name]
factory-night-watch=Factory Night Watch
[mod-description]
factory-night-watch=Multiplayer-Fabriken laufen bei leerem Server weiter. Konfigurierbare Schutzpausen bei Gebäudeverlust, leerer Forschungswarteschlange, Zeitlimit und Schaltungsbedingungen.
[mod-setting-name]
fnw-enabled=Bei leerem Server geschützt weiterlaufen
fnw-max-offline-hours=Maximale Offline-Laufzeit (Spielstunden)
fnw-research-pause=Bei leerer Forschungswarteschlange pausieren
fnw-research-idle-minutes=Wartezeit ohne Forschung (Spielminuten)
fnw-destruction-pause=Bei zerstörten Gebäuden pausieren
fnw-ignore-walls=Mauern und Tore ignorieren
fnw-ignore-robots=Roboter ignorieren
fnw-emergency-save=Bei Schutzpause Notfallspeicherung anfordern
fnw-forces=Überwachte Teams
fnw-excluded-surfaces=Ausgeschlossene Weltnamen
[mod-setting-description]
fnw-enabled=Ohne Häkchen pausiert ein leerer Server sofort. Bestehende Schutzpausen bleiben bestehen.
fnw-max-offline-hours=168 Stunden = 7 Tage. 0 = unbegrenzt. Die Laufzeit bleibt über Neustarts erhalten.
fnw-research-pause=Nur wenn kein überwachtes Team aktive oder eingereihte Forschung hat.
fnw-research-idle-minutes=Wartezeit ohne gewählte oder eingereihte Forschung.
fnw-destruction-pause=Auf Planeten durch Gegner, auf Plattformen auch durch Asteroiden. Kein Auslösen beim Abbau.
fnw-ignore-walls=Mauern und Tore lösen keinen Zerstörungsalarm aus.
fnw-ignore-robots=Bau-, Logistik- und Kampfroboter lösen keinen Zerstörungsalarm aus.
fnw-emergency-save=Drei rotierende Spielstände. Ersetzt keine regelmäßigen Backups.
fnw-forces=Durch Komma getrennte interne Namen. Normalerweise player.
fnw-excluded-surfaces=Durch Komma getrennte Namensteile. Künstliche Sandbox-Welten werden immer ignoriert.
[fnw-gui]
excluded-buildings=Zusätzliche Gebäudeausnahmen
excluded-buildings-help=Wähle einzelne Gebäudearten aus, deren Zerstörung keinen Alarm auslösen soll, z. B. Fließband oder Geschützturm. Jede Auswahl gilt für genau diese Variante in allen Qualitätsstufen und auf allen überwachten Planeten/Plattformen. Forschung, Zeitlimit und eigene Schaltungsregeln bleiben aktiv. Mit Speichern übernehmen.
no-excluded-buildings=Keine zusätzlichen Gebäudeausnahmen.
add-excluded-building=Gebäudeausnahme hinzufügen
choose-building=Gebäude auswählen
missing-building=__1__ (derzeit nicht verfügbar)
invalid-building=Ungültige Gebäudeausnahme. Bitte ein verfügbares Gebäude auswählen.
building-limit=Maximal 128 Gebäudeausnahmen möglich.
preview-save-help=Speichert alle offenen Änderungen der Factory-Night-Watch-Einstellungen.
preview-stale=Die Einstellungen wurden zwischenzeitlich geändert. Kehre zu den Ausnahmebereichen zurück, um den aktuellen Stand zu prüfen. Dein Entwurf bleibt erhalten.
area-preview=Factory Night Watch · Bereichsvorschau
preview-return=Zurück zu Ausnahmebereichen
preview-save=Speichern und zurück
preview-unsaved=Ungespeicherte Änderungen: Diese Vorschau speichert nichts. Mit „Speichern und zurück“ übernehmen. Die Markierung bleibt bis zur Rückkehr sichtbar.
preview-saved=Gespeicherter Bereich. Die Markierung bleibt auch beim Zoomen sichtbar, bis du zu den Ausnahmebereichen zurückkehrst.
areas=Ausnahmebereiche
areas-help=Ziehe Rechtecke, um Zerstörungsalarme für alle Gebäudetypen darin auszunehmen. Gilt nur auf dem gewählten Planeten/der Plattform. Die Gebäudemitte zählt; obere/linke Grenze eingeschlossen, untere/rechte ausgeschlossen. Forschung, Zeitlimit und eigene Schaltungsregeln bleiben aktiv. Mit Speichern übernehmen.
no-areas=Keine Ausnahmebereiche.
area=Bereich __1__
add-area=Ausnahmebereich zeichnen
view-area=Bereich ansehen
area-bounds=__1__ · (__2__) bis (__3__)
area-select-help=Ziehe ein Rechteck auf dem Planeten/der Plattform, um dort Zerstörungsalarme auszunehmen. Auch leere Bereiche sind möglich. Zum Abbrechen den Mauszeiger leeren. Anschließend Bereich benennen und speichern.
invalid-area=Ungültiger Bereich. Ziehe ein Rechteck mit Breite und Höhe größer null. Bereichsnamen dürfen maximal 200 Bytes enthalten.
area-limit=Maximal 64 Ausnahmebereiche möglich.
network-option=__1__ · __2__ · Netz #__3__ · __4__
network=Schaltungsnetz
choose-network=Bitte Netz auswählen …
multiple-networks=__1__ Netze gefunden. Bitte Schaltungsnetz und Anschluss ausdrücklich auswählen.
port-input=Eingang
port-output=Ausgang
port-connection=Anschluss
port-other=Anschluss __1__
selection-too-large=Auswahl zu groß. Bitte höchstens 1024 Objekte und 128 Netze auswählen.
network-label=Schaltungsnetz #__1__ · __2__ · __3__ · __4__
jump=Zum Auslöseort
jump-unavailable=Für diesen Alarm ist kein erreichbarer Ort gespeichert.
jump-failed=Die Fernansicht konnte nicht geöffnet werden. Die Schutzpause bleibt bestehen.
unlimited=Offline-Zeitlimit: unbegrenzt
remaining=Verbleibendes Offline-Zeitlimit: __1__
open=Factory Night Watch öffnen
close=Schließen
overview=Übersicht
rules=Regeln
advanced=Erweitert
status=Status: __1__
status-alarm=Schutzpause – Bestätigung erforderlich
status-paused=Pausiert
status-online=Spieler online – Überwachung in Bereitschaft
status-offline=Offline-Nachtschicht läuft
elapsed=Offline-Laufzeit: __1__
last-elapsed=Letzte Offline-Laufzeit: __1__
mode=Bei leerem Server
mode-protected=Geschützt weiterlaufen
mode-pause=Sofort pausieren
mode-help=Eine Schutzpause bleibt bestehen, bis ein Admin sie bestätigt. Eine normale Leer-Server-Pause endet beim Beitritt.
last-alarm=Letzter Pausengrund
no-alarm=Bisher keine Schutzpause.
resume=Bestätigen und fortsetzen
destruction-help=Auf Planeten bei Zerstörung durch Gegner; auf Plattformen auch durch Asteroiden. Abbauen und Rückbauen lösen keine Pause aus.
research-delay=Wartezeit ohne Forschung (Minuten)
research-help=Pausiert erst, wenn bei allen überwachten Teams weder eine Forschung gewählt noch etwas eingereiht ist. Fehlende Forschungspakete zählen nicht.
time-limit=Maximale Offline-Laufzeit begrenzen
hours=Stunden
days=Tage
simulation-help=Alle Zeiten zählen nur laufende Spielzeit. Standard: 7 Tage. Ohne Häkchen gibt es kein Zeitlimit.
exceptions=Bei Zerstörung ignorieren
circuits=Eigene Schaltungen
circuits-help=Jede aktive Regel kann die Offline-Nachtschicht pausieren. Prüfung einmal pro Spielsekunde. Eine fehlende Quelle oder Kabelverbindung löst ebenfalls eine Schutzpause aus.
no-circuits=Noch keine Schaltungsregeln eingerichtet.
add-circuit=Schaltung hinzufügen
rule=Regel __1__ aktiv
remove=Entfernen
name=Name
select-network=Netz auswählen
no-network=Noch kein Netz ausgewählt
select-help=Ziehe einen Rahmen um verbundene Schaltungsobjekte. Ein Netz wird direkt übernommen; mehrere Netze wählst du ausdrücklich im Fenster aus. Q bricht ab.
select-one=Wähle verbundene Schaltungsobjekte eines überwachten Teams auf einem Planeten oder einer Plattform.
no-cable=Kein verbundenes Schaltungsnetz eines überwachten Teams gefunden.
wire=Kabelnetz
red=Rot
