conflict=Ein anderer Admin hat Schaltungsregeln oder Ausnahmen geändert. Bitte verwerfen und neu bearbeiten.
settings-conflict=Die Servereinstellungen wurden zwischenzeitlich geändert. Bitte Verwerfen anklicken, die aktuellen Werte prüfen und deine Änderung erneut eingeben.
rule-limit=Maximal 32 Schaltungsregeln.
